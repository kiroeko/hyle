[package]
name = "crossbeam_queue_bench"
version = "0.0.0"
edition = "2021"
publish = false

# SOTA parity rival for HYLE's work-stealing queues (task #9). crossbeam-deque is
# the same-family C++/Rust counterpart that CAN'T link into a C++ TU, so it lives
# here as a standalone Rust bench run side-by-side. We pin to the LOCAL clone via a
# path dep (reproducible, offline, version-locked to 0.8.3) -- NOT crates.io.
#
# PATH ASSUMPTION: this points at ../../../../crossbeam-deque, i.e. a sibling of the
# hyle/ repo inside project-hyle/. If your layout differs, override the path here or
# swap to `crossbeam-deque = "0.8"` to pull the registry version (same API).
[dependencies]
crossbeam-deque = { path = "../../../../crossbeam-deque" }

# Match the C++ bench's optimization level: full opt + LTO + single codegen unit so
# the cross-language ns/op comparison isn't an artifact of a weaker Rust build.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
