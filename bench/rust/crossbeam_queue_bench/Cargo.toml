[package]
name = "crossbeam_queue_bench"
version = "0.0.0"
edition = "2021"
publish = false

# SOTA parity rival for HYLE's work-stealing queues (task #9). crossbeam-deque is
# the same-family C++/Rust counterpart that CAN'T link into a C++ TU, so it lives
# here as a standalone Rust bench run side-by-side.
#
# PORTABLE BY DEFAULT: depend on the crates.io release (API-identical to any local
# clone; offline builds resolve from the ~/.cargo registry cache). No machine-
# specific path. To pin a LOCAL clone instead (e.g. the one fetched by
# scripts/setup-bench-libs.sh), build with a path patch -- no edit needed:
#   cargo build --release --config \
#     'patch.crates-io.crossbeam-deque.path="../../../../crossbeam-deque"'
[dependencies]
crossbeam-deque = "0.8"

# Use optimized Release with LTO and one codegen unit. Record the actual flags
# for both compilers; these settings do not imply matching code generation.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
