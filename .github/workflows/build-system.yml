name: build-system

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-and-package-smoke:
    name: ${{ matrix.label }} core + package smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            preset: windows
            generator: Visual Studio 17 2022
          - label: Linux
            os: ubuntu-latest
            preset: linux
            generator: Unix Makefiles
          - label: macOS
            os: macos-latest
            preset: macos
            generator: Unix Makefiles
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v6

      - name: Select GCC 14
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Configure core
        run: cmake --preset ${{ matrix.preset }} -DHYLE_COMPONENTS=core -DHYLE_WERROR=ON

      - name: Build core verification surface
        run: cmake --build --preset ${{ matrix.preset }} --target hyle_core_tests --parallel 2

      - name: Run core verification surface
        run: ctest --preset ${{ matrix.preset }} -R "^hyle_core_" --output-on-failure

      - name: Verify shared/static installed pure-C consumers
        run: cmake -DHYLE_SOURCE_DIR=${{ github.workspace }} -DHYLE_SMOKE_ROOT=${{ runner.temp }}/hyle-package-smoke "-DHYLE_SMOKE_GENERATOR=${{ matrix.generator }}" -P cmake/HyleCiPackageSmoke.cmake

  linux-aarch64-cross:
    name: Linux AArch64 cross configure/build
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v6

      - name: Install GCC 14 AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu

      - name: Configure without target execution
        run: cmake --preset linux-aarch64-cross

      - name: Build target artifact
        run: cmake --build --preset linux-aarch64-cross --target hyle_core --parallel 2
