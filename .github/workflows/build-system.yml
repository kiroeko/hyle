name: build-system

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A routine push must not cancel an explicitly requested full validation.
  group: build-system-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-impact:
    name: Selected change-impact validation
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_REV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      CANDIDATE_REV: ${{ github.sha }}
      HYLE_DEP_SOURCE_CACHE: ${{ github.workspace }}/../hyle-dependency-sources
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select gates before provisioning compilers or dependency caches
        id: impact
        run: |
          python3 scripts/validation-select.py plan --base "$BASE_REV" --candidate "$CANDIDATE_REV" --output "$RUNNER_TEMP/impact-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'impact-plan.json').read_text())
          build = any(g['kind'] in ('build', 'correctness', 'headers', 'delivery') for g in plan['selected_gates'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('build=' + str(build).lower() + '\n')
          PY

      - name: Select GCC 14 for affected native gates
        if: steps.impact.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Restore locked dependency sources for affected native gates
        if: steps.impact.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ env.HYLE_DEP_SOURCE_CACHE }}
          key: ${{ runner.os }}-hyle-dependency-sources-v1-${{ hashFiles('cmake/HyleDependencyLock.json') }}

      - name: Bind execution environment
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, shutil, subprocess, sys
          from pathlib import Path
          toolchain = {'id': 'python-maintenance', 'python': sys.version}
          if os.environ.get('CXX'):
              cxx = shutil.which(os.environ['CXX'])
              version = subprocess.run([cxx, '-v'], capture_output=True, text=True, check=True).stderr
              stdlib = subprocess.check_output([cxx, '-print-file-name=libstdc++.so'], text=True).strip()
              toolchain = {'id': version, 'compiler_sha256': hashlib.sha256(Path(cxx).read_bytes()).hexdigest(),
                           'stdlib_sha256': hashlib.sha256(Path(stdlib).read_bytes()).hexdigest(),
                           'cmake': subprocess.check_output(['cmake', '--version'], text=True),
                           'CC': os.environ['CC'], 'CXX': os.environ['CXX'], 'configuration': 'Ninja/Release/WERROR/shipping-layout'}
          context = {'toolchain': toolchain, 'machine_profile': {'id': 'CI-LINUX', 'host': platform.uname()._asdict()}}
          (Path(os.environ['RUNNER_TEMP']) / 'impact-context.json').write_text(json.dumps(context))
          PY

      - name: Execute selected gates and retain receipts
        run: >-
          python3 scripts/validation-select.py run
          --base "$BASE_REV" --candidate "$CANDIDATE_REV"
          --context "$RUNNER_TEMP/impact-context.json"
          --cache "$RUNNER_TEMP/impact-evidence"
          --scratch "$RUNNER_TEMP/impact-build"
          --output "$RUNNER_TEMP/impact-result.json"

      - name: Retain selection reasons and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-impact-validation
          path: |
            ${{ runner.temp }}/impact-plan.json
            ${{ runner.temp }}/impact-result.json
            ${{ runner.temp }}/impact-context.json
            ${{ runner.temp }}/impact-evidence

  platform-and-package-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.os == 'ubuntu-latest' && 'Linux' || matrix.os == 'windows-latest' && 'Windows' || 'macOS' }} CPU baseline + distribution smoke
    strategy:
      fail-fast: false
      matrix:
        # Explicit full validation retains the existing three-host matrix.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || matrix.os == 'macos-latest' && 75 || 60 }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
      HYLE_CI_PRESET: ${{ matrix.os == 'windows-latest' && 'windows-ninja' || matrix.os == 'macos-latest' && 'macos' || 'linux' }}
      HYLE_CI_GENERATOR: ${{ matrix.os == 'windows-latest' && 'Ninja' || 'Unix Makefiles' }}
      HYLE_DEP_SOURCE_CACHE: ${{ github.workspace }}/../hyle-dependency-sources
    steps:
      - uses: actions/checkout@v7

      - name: Restore locked dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ env.HYLE_DEP_SOURCE_CACHE }}
          key: ${{ runner.os }}-hyle-dependency-sources-v1-${{ hashFiles('cmake/HyleDependencyLock.json') }}

      - name: Verify documentation contract
        if: runner.os == 'Linux'
        run: python3 scripts/check-docs.py

      - name: Select GCC 14
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Verify Unix toolchain entry
        if: runner.os == 'Linux'
        run: |
          test "$(env -u CC -u CXX ./scripts/hyle-unix.sh --print-toolchain)" = $'CC=gcc-14\nCXX=g++-14'
          if env -u CXX CC=gcc-14 ./scripts/hyle-unix.sh true; then
            echo "half-configured compiler pair unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Configure all CPU modules (Unix)
        if: runner.os != 'Windows'
        run: >-
          ./scripts/hyle-unix.sh cmake --preset ${{ env.HYLE_CI_PRESET }}
          -DHYLE_COMPONENTS=all
          -DHYLE_BUILD_TESTS=ON
          -DHYLE_TEST_INSTRUMENTATION=OFF
          -DHYLE_BUILD_BENCH=OFF
          -DHYLE_INSTALL=OFF
          -DHYLE_WERROR=ON
          -DHYLE_IO_TLS=OFF
          -DHYLE_IO_HTTP2=OFF
          -DHYLE_COMPUTE_CUDA=OFF
          -DHYLE_COMPUTE_GGML=OFF
          -DHYLE_COMPUTE_VULKAN=OFF

      - name: Configure all CPU modules (Windows selected MSVC)
        if: runner.os == 'Windows'
        run: >-
          ./scripts/hyle-windows.ps1 -Action Configure -Preset windows-ninja
          -DHYLE_COMPONENTS=all
          -DHYLE_BUILD_TESTS=ON
          -DHYLE_TEST_INSTRUMENTATION=OFF
          -DHYLE_BUILD_BENCH=OFF
          -DHYLE_INSTALL=OFF
          -DHYLE_WERROR=ON
          -DHYLE_IO_TLS=OFF
          -DHYLE_IO_HTTP2=OFF
          -DHYLE_COMPUTE_CUDA=OFF
          -DHYLE_COMPUTE_GGML=OFF
          -DHYLE_COMPUTE_VULKAN=OFF

      - name: Build all CPU module tests (Unix)
        if: runner.os != 'Windows'
        run: cmake --build --preset ${{ env.HYLE_CI_PRESET }} --target hyle_tests --parallel 2

      - name: Build all CPU module tests (Windows selected MSVC)
        if: runner.os == 'Windows'
        run: ./scripts/hyle-windows.ps1 -Action Build -Preset windows-ninja --target hyle_tests --parallel 2

      - name: Run all CPU module tests (Unix)
        if: runner.os != 'Windows'
        run: ctest --preset ${{ env.HYLE_CI_PRESET }} --output-on-failure

      - name: Run all CPU module tests (Windows selected MSVC)
        if: runner.os == 'Windows'
        run: ./scripts/hyle-windows.ps1 -Action Test -Preset windows-ninja --output-on-failure

      - name: Audit classic MSVC exact AVX-512 sort fallback
        if: runner.os == 'Windows'
        run: |
          ./scripts/hyle-windows.ps1 -Action Configure -Preset windows-ninja -DHYLE_COMPONENTS=simd -DHYLE_SIMD_EXACT_TARGET=AVX512 -DHYLE_BUILD_TESTS=ON -DHYLE_BUILD_BENCH=OFF -DHYLE_INSTALL=OFF -DHYLE_WERROR=ON
          ./scripts/hyle-windows.ps1 -Action Build -Preset windows-ninja --target hyle_simd_exact_artifact_check --parallel 2

      - name: Verify component and dependency contracts
        if: runner.os == 'Linux'
        run: >-
          cmake -DHYLE_SOURCE_DIR=${{ github.workspace }}
          -DHYLE_SMOKE_ROOT=${{ runner.temp }}/hyle-component-contract
          "-DHYLE_SMOKE_GENERATOR=${{ env.HYLE_CI_GENERATOR }}"
          -P cmake/HyleCiComponentContract.cmake

      - name: Verify production-shape tests (Unix)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        run: >-
          cmake -DHYLE_SOURCE_DIR=${{ github.workspace }}
          -DHYLE_SMOKE_ROOT=${{ runner.temp }}/hyle-product-shape-smoke
          "-DHYLE_SMOKE_GENERATOR=${{ env.HYLE_CI_GENERATOR }}"
          -P cmake/HyleCiProductShapeSmoke.cmake

      - name: Verify production-shape tests (Windows selected MSVC)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: >-
          ./scripts/hyle-windows.ps1 -Action ProductShapeSmoke
          -SmokeRoot ${{ runner.temp }}/hyle-product-shape-smoke

      - name: Verify installed package consumers (Unix)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        run: cmake -DHYLE_SOURCE_DIR=${{ github.workspace }} -DHYLE_SMOKE_ROOT=${{ runner.temp }}/hyle-package-smoke "-DHYLE_SMOKE_GENERATOR=${{ env.HYLE_CI_GENERATOR }}" -P cmake/HyleCiPackageSmoke.cmake

      - name: Verify installed package consumers (Windows selected MSVC)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: ./scripts/hyle-windows.ps1 -Action PackageSmoke -SmokeRoot ${{ runner.temp }}/hyle-package-smoke

      - name: Verify complete-source package
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: >-
          cmake -DHYLE_SOURCE_DIR=${{ github.workspace }}
          -DHYLE_PACKAGE_BUILD=${{ github.workspace }}/build-${{ env.HYLE_CI_PRESET }}
          -DHYLE_SMOKE_ROOT=${{ runner.temp }}/hyle-source-package-smoke
          "-DHYLE_SMOKE_GENERATOR=${{ env.HYLE_CI_GENERATOR }}"
          -P cmake/HyleCiSourcePackageSmoke.cmake

  linux-aarch64-cross:
    name: Linux AArch64 all-component cross build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      HYLE_DEP_SOURCE_CACHE: ${{ github.workspace }}/../hyle-dependency-sources
    steps:
      - uses: actions/checkout@v7

      - name: Restore locked dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ env.HYLE_DEP_SOURCE_CACHE }}
          key: ${{ runner.os }}-hyle-dependency-sources-v1-${{ hashFiles('cmake/HyleDependencyLock.json') }}

      - name: Install GCC 14 AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu

      - name: Configure without target execution
        run: cmake --preset linux-aarch64-cross

      - name: Build all CPU component artifacts
        run: cmake --build --preset linux-aarch64-cross --parallel 2

  windows-clangcl-foundation:
    name: Windows clang-cl foundation + SIMD strict
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
      HYLE_DEP_SOURCE_CACHE: ${{ github.workspace }}/../hyle-dependency-sources
    steps:
      - uses: actions/checkout@v7

      - name: Restore locked dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ env.HYLE_DEP_SOURCE_CACHE }}
          key: ${{ runner.os }}-hyle-dependency-sources-v1-${{ hashFiles('cmake/HyleDependencyLock.json') }}

      - name: Configure strict Windows ABI with the Clang frontend
        run: >-
          ./scripts/hyle-windows.ps1 -Action Configure -Preset windows-clangcl
          '-DHYLE_COMPONENTS=core,error,obs,platform,time,mem,container,util,simd'
          -DHYLE_BUILD_TESTS=ON
          -DHYLE_TEST_INSTRUMENTATION=ON
          -DHYLE_BUILD_BENCH=OFF
          -DHYLE_INSTALL=OFF
          -DHYLE_WERROR=ON
          -DHYLE_IO_TLS=OFF
          -DHYLE_COMPUTE_CUDA=OFF

      - name: Build foundation and SIMD tests
        run: ./scripts/hyle-windows.ps1 -Action Build -Preset windows-clangcl --target hyle_tests --parallel 2

      - name: Run foundation and SIMD tests
        run: ./scripts/hyle-windows.ps1 -Action Test -Preset windows-clangcl --output-on-failure

      - name: Build and audit every x86 exact artifact
        run: |
          ./scripts/hyle-windows.ps1 -Action Configure -Preset windows-clangcl -DHYLE_SIMD_EXACT_TARGET=SCALAR
          ./scripts/hyle-windows.ps1 -Action Build -Preset windows-clangcl --target hyle_simd_exact_artifact_check --parallel 2
          ./scripts/hyle-windows.ps1 -Action Configure -Preset windows-clangcl -DHYLE_SIMD_EXACT_TARGET=SSE4
          ./scripts/hyle-windows.ps1 -Action Build -Preset windows-clangcl --target hyle_simd_exact_artifact_check --parallel 2
          ./scripts/hyle-windows.ps1 -Action Configure -Preset windows-clangcl -DHYLE_SIMD_EXACT_TARGET=AVX2
          ./scripts/hyle-windows.ps1 -Action Build -Preset windows-clangcl --target hyle_simd_exact_artifact_check --parallel 2
          ./scripts/hyle-windows.ps1 -Action Configure -Preset windows-clangcl -DHYLE_SIMD_EXACT_TARGET=AVX512
          ./scripts/hyle-windows.ps1 -Action Build -Preset windows-clangcl --target hyle_simd_exact_artifact_check --parallel 2

  linux-locked-feature-package:
    name: Linux locked adapters + feature SDK + Tracy smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
      HYLE_DEP_SOURCE_CACHE: ${{ github.workspace }}/../hyle-dependency-sources
    steps:
      - uses: actions/checkout@v7

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Restore locked dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ env.HYLE_DEP_SOURCE_CACHE }}
          key: ${{ runner.os }}-hyle-dependency-sources-v1-${{ hashFiles('cmake/HyleDependencyLock.json') }}

      - name: Verify feature adapters, static/shared SDKs, and trace-on consumer
        run: >-
          cmake -DHYLE_SOURCE_DIR=${{ github.workspace }}
          -DHYLE_SMOKE_ROOT=${{ runner.temp }}/hyle-feature-package-smoke
          "-DHYLE_SMOKE_GENERATOR=Unix Makefiles"
          -P cmake/HyleCiFeaturePackageSmoke.cmake
