name: build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation and engine host / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set dependency cache path
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "hyle-dependency-sources"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"HYLE_DEP_SOURCE_CACHE={path}\n")
      - uses: actions/cache@v5
        with:
          path: ${{ env.HYLE_DEP_SOURCE_CACHE }}
          key: ${{ runner.os }}-hyle-sources-${{ hashFiles('cmake/HyleDependencyLock.json') }}
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build
      - name: Initialize
        run: >-
          python scripts/init.py --name ci-foundation
          --components core,error,platform,time,mem,container --tests --static
      - name: Build
        run: python scripts/build.py --name ci-foundation --target hyle_tests --jobs 2
      - name: Test
        run: python scripts/test.py --name ci-foundation --jobs 2
      - name: Verify native engine host coverage
        shell: python
        run: |
          import json
          import subprocess
          listing = json.loads(subprocess.check_output([
              "ctest", "--test-dir", ".scratch/build/ci-foundation", "--show-only=json-v1"
          ], text=True))
          required = {
              "hyle_inference_request_loop_test", "hyle_engine_worker_contract_test",
              "hyle_inference_request_execution_failure_test", "hyle_inference_step_execution_test",
          }
          missing = required - {test["name"] for test in listing["tests"]}
          if missing:
              raise RuntimeError(f"Missing engine host contracts: {sorted(missing)}")
      - name: Text protocol and session contracts
        run: >-
          python -S -B -m unittest
          tests.tooling.text_frontend_test
          tests.tooling.text_completion_protocols_test
          tests.tooling.text_tools_test
          tests.tooling.text_models_test
          tests.tooling.text_worker_client_test
          tests.tooling.text_sessions_test
          tests.tooling.text_prepared_capabilities_test
      - name: Inference architecture boundaries
        run: python -S -B tests/tooling/inference_architecture_boundaries_test.py -v
      - name: Benchmark parser
        run: python tests/tooling/bench_stat_parser_test.py
      - name: Paired statistics
        run: python tests/tooling/hyle_perf_core_test.py
      - name: Nanobench parser
        run: python tests/tooling/hyle_perf_nanobench_test.py
      - name: SIMD route generation
        run: python scripts/simd-op-coverage.py --check
      - name: SIMD configuration errors
        run: python tests/tooling/simd_routes_test.py
